<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a1f35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#6610f2"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#6610f2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Decorative circles -->
  <circle cx="1120" cy="90" r="80" fill="#0d6efd" opacity="0.08"/>
  <circle cx="1160" cy="560" r="55" fill="#6610f2" opacity="0.10"/>
  <circle cx="950" cy="580" r="30" fill="#0d6efd" opacity="0.06"/>

  <!-- Z logo mark (200x200, centered vertically on left) -->
  <g transform="translate(70, 215)">
    <rect width="200" height="200" rx="39" ry="39" fill="url(#accent)"/>
    <!-- Z path scaled: original 512→200, factor=0.390625 -->
    <!-- Original: M77,77 L435,77 L435,156 L196,356 L435,356 L435,435 L77,435 L77,356 L316,156 L77,156 Z -->
    <path d="M 30,30 L 170,30 L 170,61 L 77,139 L 170,139 L 170,170 L 30,170 L 30,139 L 123,61 L 30,61 Z" fill="white"/>
  </g>

  <!-- Name -->
  <text x="310" y="270" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="white" letter-spacing="-1">Zulfikar Isnaen</text>

  <!-- Divider line -->
  <rect x="310" y="292" width="600" height="3" fill="url(#accentH)" rx="2"/>

  <!-- Title -->
  <text x="310" y="348" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#60a5fa">MES Engineer &amp; Software Engineer</text>

  <!-- Tags -->
  <rect x="310" y="385" width="130" height="38" rx="6" fill="#0d6efd" opacity="0.2"/>
  <text x="375" y="409" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#60a5fa" text-anchor="middle">ISA-95</text>

  <rect x="455" y="385" width="170" height="38" rx="6" fill="#0d6efd" opacity="0.2"/>
  <text x="540" y="409" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#60a5fa" text-anchor="middle">Manufacturing</text>

  <rect x="640" y="385" width="140" height="38" rx="6" fill="#6610f2" opacity="0.2"/>
  <text x="710" y="409" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a78bfa" text-anchor="middle">TypeScript</text>

  <rect x="795" y="385" width="120" height="38" rx="6" fill="#6610f2" opacity="0.2"/>
  <text x="855" y="409" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a78bfa" text-anchor="middle">Vue.js</text>

  <!-- Website URL -->
  <text x="310" y="470" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#64748b">zulfikarisnaen.com</text>
</svg>
